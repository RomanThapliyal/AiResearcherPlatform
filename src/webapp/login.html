<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Research & Development Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h1>AI Research & Development Platform</h1>
            <p style="text-align:center; margin-bottom:20px; color:#666;">Sign in to continue</p>

            <div id="errorMsg" class="msg error" style="display:none;">Invalid email or password.</div>
            <form action="LoginServlet" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" style="width:100%;">Login</button>
            </form>

            <div class="switch-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>
    <script>
    if (new URLSearchParams(window.location.search).get("error") === "invalid") {
        document.getElementById("errorMsg").style.display = "block";
    }
</script>
</body>
</html>
